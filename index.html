<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets us use the full screen on phones with notches -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2b301f" />
    <meta name="description" content="A persistent multiplayer WW2 command game played on a real-world map." />
    <title>Frontline Command</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Lets phones "Add to Home Screen" and open the game full-screen -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="app">
      <!-- ===== Top bar: game title + player resources ===== -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-star" aria-hidden="true">★</span>
          <span class="brand-name">Frontline Command</span>
        </div>

        <!-- Resource readouts, filled in by src/ui/topbar.js -->
        <ul class="resources" aria-label="Resources">
          <li class="resource" title="Money"><span class="resource-label">Funds</span><span id="res-money">—</span></li>
          <li class="resource" title="Supplies"><span class="resource-label">Supplies</span><span id="res-supplies">—</span></li>
          <li class="resource" title="Experience level"><span class="resource-label">Rank</span><span id="res-level">—</span>
            <span class="xp-bar" aria-hidden="true"><span id="xp-fill"></span></span></li>
        </ul>

        <!-- Who is logged in. Hidden until a profile is loaded. -->
        <div id="player" class="player" hidden>
          <span id="player-nation" class="nation-chip nation-chip--sm"></span>
          <button id="player-name" class="player-name" title="Your profile"></button>
          <button id="admin-link" class="link-btn" hidden>Admin</button>
          <button id="help" class="link-btn" title="How to play" aria-label="How to play">Help</button>
          <button id="logout" class="link-btn" title="Log out">Log out</button>
        </div>

        <button id="panel-toggle" class="icon-btn" aria-label="Toggle side panel" aria-expanded="true">☰</button>
      </header>

      <!-- ===== Main area: map + side panel ===== -->
      <main class="layout">
        <section class="map-wrap">
          <div id="map" aria-label="Operations map"></div>
          <!-- Small readout showing the last clicked map position -->
          <div id="coords" class="coords">Click the map to read a position</div>
        </section>

        <aside id="panel" class="panel">
          <nav class="tabs" role="tablist">
            <button class="tab is-active" role="tab" data-tab="missions">Missions</button>
            <button class="tab" role="tab" data-tab="units">Units</button>
            <button class="tab" role="tab" data-tab="bases">Bases</button>
            <button class="tab" role="tab" data-tab="alliance">Alliance</button>
            <button class="tab" role="tab" data-tab="ranks">Ranks</button>
            <!-- Phones only: make the bottom sheet taller / shorter -->
            <button id="panel-size" class="tab tab--size" aria-label="Make panel larger">▲</button>
          </nav>
          <div id="panel-body" class="panel-body"></div>
        </aside>
      </main>
    </div>

    <!-- type="module" lets us use `import` — Vite bundles everything from here -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
